/* ================= 学习状态（localStorage） ================= */
const LS_KEY = 'baguwen_ide_state_v1';
const store = loadStore();
function loadStore(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return Object.assign({mastery:{},fav:{},mocks:[],today:{}}, JSON.parse(raw));
  }catch(e){}
  return {mastery:{},fav:{},mocks:[],today:{}};
}
function saveStore(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){}
}
function markQ(qid, level){
  if(level === null) delete store.mastery[qid];
  else {
    store.mastery[qid] = level;
    if(!store.rev) store.rev = {};
    store.rev[qid] = Date.now();
  }
  saveStore(); refreshChrome();
}
function toggleFav(qid){
  if(store.fav[qid]) delete store.fav[qid];
  else store.fav[qid] = 1;
  saveStore(); refreshChrome();
}
function todayCount(){
  const d = new Date();
  const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  if(store.today && store.today.key === key) return store.today.n || 0;
  return 0;
}
function addToday(){
  const d = new Date();
  const key = d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  if(!store.today) store.today = {};
  if(store.today.key === key) store.today.n = (store.today.n||0)+1;
  else store.today = {key:key, n:1};
  saveStore();
}

/* ================= 派生统计 ================= */
function catStats(cid){
  const qs = QUESTIONS.filter(q=>q.cat===cid);
  const total = qs.length;
  let know=0,fuzzy=0,bad=0;
  qs.forEach(q=>{
    const m = store.mastery[q.id];
    if(m==='know') know++;
    else if(m==='fuzzy') fuzzy++;
    else if(m==='unknown') bad++;
  });
  const done = know+fuzzy+bad;
  return {total, know, fuzzy, bad, done, rate: total? Math.round(done/total*100):0};
}
function overall(){
  const total = QUESTIONS.length;
  let know=0,fuzzy=0,bad=0;
  QUESTIONS.forEach(q=>{
    const m = store.mastery[q.id];
    if(m==='know') know++;
    else if(m==='fuzzy') fuzzy++;
    else if(m==='unknown') bad++;
  });
  return {total, know, fuzzy, bad, done:know+fuzzy+bad,
    rate: total? Math.round((know+fuzzy+bad)/total*100):0,
    knowRate: total? Math.round(know/total*100):0};
}

/* ================= 工具 ================= */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function hl(text, kw){
  if(!kw) return text;
  const safe = esc(kw);
  const parts = String(text).split(safe);
  return parts.join('<mark>'+safe+'</mark>');
}

  'col-04':'ArrayList 底层数组，随机访问快、中间插入慢；LinkedList 底层链表，插入删除快、随机访问慢。',
  'col-05':'扩容是新建一个 1.5 倍大的数组把旧元素复制过去。每次扩容都要复制，所以知道大小要提前指定。',
  'col-06':'就把它想成一排抽屉：先算哈希值定位到哪个抽屉，再在抽屉里挂的链子上找。链表太长（≥8个）就换成红黑树，查得更快。',
  'col-07':'put 时先算 key 的 hash 定位桶，桶空就直接放；桶非空就比对 key，相同就覆盖，不同就挂链表尾；还要判断要不要扩容。',
  'col-08':'扩容是容量翻倍。因为容量是 2 的幂，元素在新数组里要么留在原位、要么原位置+旧容量，所以不用重新算 hash。',
  'col-09':'JDK7 是数组+链表；JDK8 链表太长（≥8）转红黑树，查询从 O(n) 变 O(log n)；JDK7 头插法会成环，JDK8 改尾插。',
  'col-10':'多线程并发 put 会丢数据、resize 时链表可能成环。解决：用 ConcurrentHashMap 或外部加锁。',
  'col-11':'两个 key 算出同一位置叫哈希冲突，用链表挂起来；链表太长查找慢，超过 8 个转红黑树加快查找。',
  'col-12':'HashMap 的线程安全版。JDK7 用分段锁（一把锁管一段），JDK8 改成 synchronized 锁单个桶 + CAS，锁更细、并发更高。',
  'col-13':'Hashtable 是老古董，方法全加 synchronized 锁整个表、慢；HashMap 不锁、快。现在用 ConcurrentHashMap 代替它。',
  'col-14':'HashSet 去重无序；LinkedHashSet 按插入顺序排；TreeSet 按大小排序（要实现 Comparable）。',
  'col-15':'四种遍历：keySet 拿 key 再 get、entrySet 直接拿键值对（推荐）、forEach、迭代器。',
  'col-16':'写时复制：读不加锁，写时复制一份新数组改完再换。读多写极少的场景用，写多了性能差。',
  'col-17':'是为了让 hash&(n-1) 等价于取模，散列更均匀，扩容时位置计算也简单。',
  'jvm-01':'内存分：堆（对象）、栈（方法调用局部变量）、方法区（类信息常量）、程序计数器、本地方法栈。重点是堆和栈。',
  'jvm-02':'堆、方法区是所有线程共享的；栈、程序计数器、本地方法栈是每个线程私有的。',
  'jvm-03':'堆里放 new 出来的对象（共享、会 GC）；栈里放方法调用的栈帧和局部变量（线程私有、方法结束就弹掉）。',
  'jvm-04':'类加载→堆里分配内存→设零值→设对象头→执行 init。面试答这五步就行。',
  'jvm-05':'对象由对象头（类信息/锁）、实例数据（字段）、对齐填充三部分组成。',
  'jvm-06':'句柄访问（多一次中转但移动对象不用改引用）和直接指针（快，HotSpot 用这个）。',
  'jvm-07':'加载→验证→准备→解析→初始化。记成"加验准解初"。',
  'jvm-08':'类加载像找工作：先让爹（父类加载器）去加载，爹说找不到才自己来。防止核心类被人替换篡改。',
  'jvm-09':'OOM 就是内存用完了还分配不出来。常见：堆对象没释放、方法区类加载太多、栈太深递归。',
  'jvm-10':'三种：标记-清除（碎片多）、标记-复制（两块互换无碎片）、标记-整理（往一端挪）。新生代用复制，老年代用整理。',
  'jvm-11':'GC Roots 就是一定不能回收的对象起点：栈里引用的、静态变量、常量、JNI 引用。从它们搜不到的才回收。',
  'jvm-12':'G1 把堆切成很多小格子（Region），每次挑垃圾最多的先回收，停顿可预测，大堆用它。',
  'jvm-13':'强引用=必不回收；软引用=内存不够才回收（缓存用）；弱引用=下次 GC 就回收；虚引用=只收个通知。',
  'jvm-14':'解释器一行一行翻译（启动快），JIT 把热点代码直接编成机器码（运行快）。两者配合：启动靠解释器，跑起来靠 JIT。',
  'jvm-15':'三个：启动类加载器（加载核心库）、扩展类加载器、应用类加载器（加载你写的类）。',
  'con-01':'进程是程序跑起来的实例（独立内存），线程是进程里的执行单元（共享内存）。创建线程：继承 Thread、实现 Runnable、线程池。',
  'con-02':'新建→就绪→运行→阻塞→死亡，重点是这五个状态怎么互相转。',
  'con-03':'start() 是让 JVM 开新线程跑 run()；直接调 run() 就是普通方法调用，根本没开新线程。',
  'con-04':'JMM 规定多线程内存可见性规则：每个线程有自己的工作内存，主内存变量修改要按规则刷回去，否则别的线程看不见。',
  'con-05':'volatile 保证可见性（一个改了别的立刻看见）和禁止指令重排，但不保证原子性（i++ 还是会错）。适合状态标志位。',
  'con-06':'volatile 只保证可见性不保证原子；synchronized 既保证可见性又保证原子（互斥），但更重、会阻塞。',
  'con-07':'底层是对象头里的 monitor（管程）。锁升级：无锁→偏向锁→轻量级锁→重量级锁，越抢越重，不会降级。',
  'con-08':'按特性分：公平/非公平、可重入、独享/共享、乐观/悲观、自旋锁。面试挑两个讲就行。',
  'con-09':'synchronized 是关键字、自动释放、非公平；ReentrantLock 是类、要手动 lock/unlock（finally 里）、可公平可超时。灵活但容易忘释放。',
  'con-10':'CAS=比较并交换，无锁乐观更新：内存值==预期值才改成新值。缺点：循环慢、只能保证一个变量原子、ABA 问题。',
  'con-11':'死锁是两个线程互相等对方释放锁。四个条件：互斥、持有并等待、不可剥夺、循环等待。按顺序加锁破循环等待最实用。',
  'con-12':'七个参数：核心线程数、最大线程数、空闲存活、队列、工厂、拒绝策略。任务来先给核心，满了进队列，队列满了开到最大，再满就拒绝。',
  'con-13':'四种：固定大小、缓存型、单线程、定时。不推荐 Executors 因为队列/线程数没上限会 OOM，要手动 new ThreadPoolExecutor。',
  'con-14':'AQS 是并发锁底层框架：一个 state 变量+一个等待队列。抢锁就是 CAS 改 state，抢不到进队列挂起，释放时唤醒队首。',
  'con-15':'ThreadLocal 给每个线程一份独立副本。内存泄漏是因为 map 的 key 是弱引用、value 是强引用，线程池线程不销毁时 value 一直留着，用完要 remove。',
  'con-16':'常用：ConcurrentHashMap、CopyOnWriteArrayList、BlockingQueue。前两个线程安全集合，BlockingQueue 做生产者消费者。',
  'spr-01':'Spring 是核心框架（管 Bean）；SpringMVC 是它的 web 层（收请求）；SpringBoot 是脚手架（自动配置，快速搭 Spring）。',
  'spr-02':'以前是你自己 new 对象，现在把对象交给 Spring 容器管，你要什么它注入什么——控制权反转了。',
  'spr-03':'实例化→属性填充→Aware 回调→前置处理→初始化→后置→使用→销毁。背个大概顺序。',
  'spr-04':'BeanFactory 是 Spring 最底层的容器接口；FactoryBean 是你自定义造 Bean 的工厂（getObject 返回你要的对象）。名字像但完全两回事。',
  'spr-05':'不改原代码，就在方法前后偷偷加日志/事务/权限——像给方法套了一层滤镜。',
  'spr-06':'JDK 动态代理基于接口（没接口不能用）；CGLIB 基于继承（生成子类，不能代理 final 类）。Spring 默认有接口用 JDK，没接口用 CGLIB。',
  'spr-07':'七种传播行为，重点两个：REQUIRED（有事务就加入没有就新建，默认）、REQUIRES_NEW（挂起当前事务开新事务）。',
  'spr-08':'和数据库一样四级。Spring 默认用数据库的隔离级别，可自己改。传播机制比隔离级别考得多。',
  'spr-09':'同类内部调用、非 public 方法、异常被 catch 没抛出、数据库不支持事务、多线程——都会让 @Transactional 失效。',
  'spr-10':'@Autowired 是 Spring 的按类型注入；@Resource 是 JDK 的默认按名字注入。日常用 @Autowired 就行。',
  'spr-11':'用三级缓存解决：单例创建中先把早期对象暴露出来，需要时拿出来。为什么三级不用二级是因为要处理代理对象。',
  'spr-12':'请求进来→DispatcherServlet→找 HandlerMapping→调 Controller→返回 ModelAndView→视图渲染→响应。',
  'spr-13':'@Controller 处理请求、@RequestMapping 映射路径、@RequestParam 接参数、@RequestBody 接 JSON、@ResponseBody 返回 JSON、@RestController 等于前两个合一。',
  'spr-14':'Spring Boot 启动时扫描所有 jar 里的配置文件，看你引入了哪些 starter，自动把需要的 Bean 配好。',
  'spr-15':'Starter 就是一个依赖包，把某功能需要的所有依赖和默认配置打包在一起，引一个 starter 就有整套，不用自己凑版本。',
  'spr-16':'单例 Bean 本身不线程安全，但 Spring 让 Bean 不含可变成员变量，状态放方法参数里（栈上），就安全。',
  'spr-17':'工厂（BeanFactory）、单例（Bean 默认单例）、代理（AOP）、模板方法（JdbcTemplate）、观察者（事件）、适配器。',
  'myb-01':'JDBC 一堆样板代码（连接、预编译、手动映射结果集）。MyBatis 把 SQL 和 Java 解耦，自动帮你把结果集映射成对象。',
  'myb-02':'#{} 是预编译占位符（防注入）；${} 是字符串直接替换（有注入风险）。#{} 能防注入是因为它用 PreparedStatement 的 ?。',
  'myb-03':'Mapper 接口的全限定名对应 XML 里的 namespace，方法名对应 statement id，参数和返回类型自动匹配。',
  'myb-04':'动态 SQL 标签：if（条件拼接）、where（自动加 where 去 and）、foreach（in 遍历）、set（更新）、choose/when（分支）。',
  'myb-05':'一级缓存是 SqlSession 级（默认开，同一次会话命中）；二级是 Mapper 级（要手动开，跨会话）。实际用得少。',
  'myb-06':'MyBatis 执行 SQL 时经过一条拦截链，你可以在链上挂自己的插件，像过滤器一样拦在执行过程里。',
  'myb-07':'延迟加载=用到关联对象才去查数据库，不一次性全查。比如查用户时不立刻查订单，访问 getOrders() 才查。',
  'myb-08':'resultType 直接写返回类型名（简单情况）；resultMap 手动定义列名和字段的映射关系（复杂时用）。',
  'myb-09':'MyBatis 半自动（SQL 自己写、灵活）；Hibernate 全自动（不用写 SQL，但复杂查询不灵活）。国内 MyBatis 主流。',
  'myb-10':'读配置文件→构建 SqlSessionFactory→打开 SqlSession→注册 Mapper 接口→执行。',
  'myb-11':'两种：XML 写在文件里（namespace 绑定接口）；注解写在接口方法上（@Select 等）。',
  'myb-12':'物理分页用 PageHelper 插件（自动加 limit）；RowBounds 是内存分，慢，生产用 PageHelper。',
  'mys-01':'原子性=要么全做要么全不做；一致性=数据不被玩坏；隔离性=多事务互不干扰；持久性=提交就永久存盘。',
  'mys-02':'读未提交（脏读）、读已提交（不可重复读）、可重复读（InnoDB 默认，幻读）、串行化。级别越高越安全越慢。',
  'mys-03':'脏读=读到别人没提交的数据；不可重复读=同一条记录两次读值变了；幻读=同一个范围两次查行数变了（多了行）。',
  'mys-04':'InnoDB 用 MVCC（快照读）+间隙锁（防止别人往范围里插新行）解决幻读。',
  'mys-05':'索引就像书的目录：B+树把所有数据放最底层叶子节点、用双向链表串起来，范围查询特别快；树矮，磁盘 IO 少。',
  'mys-06':'聚簇索引叶子直接存整行（主键就是聚簇索引）；二级索引叶子存主键，查到主键还要回表再查一次整行。',
  'mys-07':'联合索引（a,b,c）必须从最左列 a 开始连续用，否则索引失效。相当于先按 a 排，a 相同再按 b 排。',
  'mys-08':'覆盖索引=要查的列全在索引里，不用回表直接返回。把高频查询列放进索引就能用上。',
  'mys-09':'加索引、避免 select *、where 不用函数/隐式转换、小表驱动大表、explain 看执行计划、分页优化。',
  'mys-10':'慢查询=执行时间超过阈值的 SQL。开慢查询日志抓出来，用 explain 分析，加索引/改写法。',
  'mys-11':'按粒度：行锁、表锁、间隙锁；按性质：共享锁（读）、排他锁（写）。锁不到索引会升级表锁。',
  'mys-12':'MVCC：每行存多个版本（undo log），读的时候按快照读历史版本，写才改最新，读写不互堵。',
  'mys-13':'binlog 是 Server 层记的改了什么（主从复制用）；redo log 是 InnoDB 记的物理修改（崩溃恢复）；undo log 是回滚用的旧版本。',
  'mys-14':'SQL 注入就是把恶意 SQL 拼进用户输入里执行。防法：预编译 #{}、白名单、独立只读账号。我项目里 NL2SQL 就是这么防的。',
  'red-01':'快的秘诀：数据全在内存里、单线程避免加锁抢锁、IO 多路复用。不是真单线程，网络收发是多线程的。',
  'red-02':'五种：String（缓存/计数）、Hash（对象）、List（队列）、Set（去重/标签）、ZSet（排行榜）。',
  'red-03':'穿透=查数据库根本没有的东西一直打你；击穿=一个热点 key 刚好过期，请求全打穿到库；雪崩=一堆 key 同时过期。',
  'red-04':'RDB 是定时快照（快，但宕机丢数据）；AOF 是记每条写命令（安全，但文件大恢复慢）。生产常用 AOF+混合。',
  'red-05':'先更新数据库再删缓存（Cache Aside）。删缓存而不是更新缓存，因为更新可能有并发脏数据。',
  'red-06':'过期删除=惰性删除（访问时才删）+定期删除（抽样删）；内存淘汰=内存满了按策略踢（如 LRU 踢最少用的）。',
  'red-07':'用 SET key value NX EX（不存在才设置+带过期），解锁用 Lua 保证原子性。要设过期防死锁。',
  'red-08':'IO 多路复用=一个线程监听多个连接，哪个有数据就处理哪个，不用一个连接一个线程，所以单线程也能扛高并发。',
  'red-09':'热 key=访问量特别集中的 key（会把单 Redis 打挂）；大 key=value 特别大（拖慢网络）。处理：拆 key、压缩。',
  'red-10':'做缓存（热点数据）、分布式锁、计数器（点赞）、排行榜（ZSet）、会话存储（Session 共享）。',
  'net-01':'1.0 一次请求一个连接；1.1 长连接可复用；2.0 多路复用（一个连接并行多个请求）、头部压缩、二进制帧。',
  'net-02':'200 成功、301/302 重定向、304 缓存、400 参数错、401 没登录、403 没权限、404 找不到、500 服务器错。',
  'net-03':'GET 参数在 URL、有长度限制、幂等、用来查；POST 参数在 body、无长度限制、用来增改。本质都是 TCP。',
  'net-04':'三次握手：SYN→SYN+ACK→ACK。两次不行是因为旧的重复连接请求会被误建立、浪费资源。',
  'net-05':'四次挥手：FIN→ACK→FIN→ACK。为什么四次因为被动方可能还有数据没发完，要分两步。',
  'net-06':'TCP 可靠、面向连接、有序、慢；UDP 不可靠、无连接、快（视频/语音用它）。',
  'net-07':'HTTP 明文传输；HTTPS=HTTP+TLS 加密，要证书，防窃听篡改。',
  'net-08':'RESTful 就是一套规范：URL 表资源、用 GET/POST/PUT/DELETE 表增删改、无状态、JSON 格式。',
  'net-09':'服务器单向推送：浏览器发起请求后连接不断，服务器有事就主动推消息。比 WebSocket 轻，适合实时通知。',
  'net-10':'Cookie 存在浏览器、小；Session 存在服务器靠 Cookie 认人；Token 自包含（JWT），服务器不存、跨域方便。',
  'net-11':'TCP 是流式的没有边界，发的多个包可能粘一起（粘包）或被拆（拆包）。解决：定长/加特殊结尾符/包头报长度。',
  'net-12':'DNS 解析→TCP 三次握手→TLS 握手（HTTPS）→发 HTTP 请求→服务器返回→浏览器渲染→加载资源。',
  'prj-01':'一句话：我做了个基于大模型的医院智能导诊，Spring Boot+LangChain4j，能问答、查科室、预约挂号。',
  'prj-02':'多模型就是配了多个 ChatModel Bean（百炼/本地 Ollama），按场景选，换模型只改配置文件不用改业务代码。',
  'prj-03':'流式用 WebFlux 的 Flux，Controller 逐段推给前端（SSE）。选 WebFlux 因为它异步非阻塞，扛得住长连接的大量用户。',
  'prj-04':'SSE 就是 text/event-stream 格式，每段数据前面带 data: 、以两个换行结尾，浏览器 EventSource 自动接收。',
  'prj-05':'大模型不知道你医院的资料，所以先把用户问题去向量库搜相关段落，连同问题一起塞给模型，让它照着资料答。',
  'prj-06':'关键词搜不了语义（头痛和脑袋疼搜不到一起），向量检索能按意思搜；Pinecone 是免运维的托管向量库，不用自己部署。',
  'prj-07':'LangChain4j 自带的记忆存内存重启就丢。我自己写 ChatMemoryStore 把对话存 MongoDB，按用户 id 隔离，还做了 20 条滑动窗口。',
  'prj-08':'用户问病→RAG 检索科室→模型判断要不要挂号→调预约工具写 MySQL→返回结果。形成问→查→约闭环。',
  'prj-09':'MySQL 存业务数据（预约记录，要事务）；MongoDB 存对话历史（文档型、结构灵活、量大会增删快）。',
  'prj-10':'预约前先查有没有重复预约（getOne 查重），再把 id 设 null 防模型编主键；工具返回结果校验后才确认。',

/* 轻量答案渲染：代码块 + 行内代码 + 加粗 + 列表 */
function renderAnswer(text){
  const lines = String(text).split('\n');
  let html = '', inCode = false, inList = false;
  const closeList = ()=>{ if(inList){ html += '</ul>'; inList = false; } };
  for(const raw of lines){
    const line = raw.replace(/\s+$/,'');
    if(line.trim().startsWith('```')){
      closeList();
      if(inCode){ html += '</code></pre>'; inCode = false; }
      else { html += '<pre><code>'; inCode = true; }
      continue;
    }
    if(inCode){ html += esc(line) + '\n'; continue; }
    if(line.trim()===''){ closeList(); continue; }
    const t = line.trim();
    const isBullet = /^[-•·]\s+/.test(t) || /^(\d+)[.、]\s+/.test(t);
    if(isBullet){
      if(!inList){ html += '<ul>'; inList = true; }
      const li = t.replace(/^[-•·]\s+/, '').replace(/^(\d+)[.、]\s+/, '');
      html += '<li>' + inline(li) + '</li>';
      continue;
    }
    closeList();
    html += '<p>' + inline(t) + '</p>';
  }
  closeList();
  if(inCode) html += '</code></pre>';
  return html;
}
function inline(s){
  return gloss(esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(\*\*|`)/g, ''));
}

  '脏读':'读到别人还没提交的"半成品"数据。',
  '不可重复读':'同一条记录，两次读到的值不一样了。',
  '幻读':'同一个范围，两次查询多出几行"幽灵数据"（别人插进去了）。',
  'B+树':'一种索引结构：数据全放在最底层叶子、用链表串起来，范围查询飞快。',
  '聚簇索引':'主键索引：叶子节点直接存整行数据，找到主键就拿到全部。',
  '非聚簇索引':'普通索引：叶子只存主键，要查整行还得再回表。',
  '回表':'用普通索引查到主键，再按主键回主索引查一次整行数据。',
  '最左前缀':'联合索引必须从最左边那列开始连续用，跳列就失效。',
  '覆盖索引':'要查的列索引里全都有，不用回表直接返回，快。',
  '慢查询':'执行时间超过阈值的 SQL，要抓出来用 explain 优化。',
  'MVCC':'多版本并发控制：读的时候看"历史快照"，写才动最新版，读写不互相堵。',
  '快照读':'读一个"拍照时"的历史版本，不打扰正在写的人。',
  '间隙锁':'锁住一段"空位"，防止别人往中间插新行（防幻读）。',
  '行锁':'只锁住一行，别的行照常操作，并发高。',
  '表锁':'锁整张表，简单粗暴但并发低。',
  'binlog':'记录"改了什么"的日志，主从复制靠它同步。',
  'redo log':'崩溃恢复用的日志：数据还没落盘但先记了账，重启照着恢复。',
  'undo log':'回滚用的"旧版本"数据，MVCC 也靠它。',
  'SQL注入':'把恶意代码当参数拼进 SQL 里执行，偷数据删数据。',
  '执行计划':'MySQL 打算怎么执行这条 SQL 的"方案图"，explain 查看。',
  '缓存穿透':'查一个数据库里根本没有的东西，每次请求都穿透到库。',
  '缓存击穿':'一个热点 key 刚好过期，一瞬间请求全打到数据库。',
  '缓存雪崩':'一大批 key 同时过期，数据库被压垮。',
  '持久化':'把内存里的数据存到磁盘，重启不丢。',
  'RDB':'Redis 定时给内存"拍快照"存盘：快，但宕机可能丢最新数据。',
  'AOF':'Redis 把每条写命令记下来，重启重放：安全，但文件大。',
  '淘汰策略':'内存满了踢谁出去，比如 LRU 踢最久没用的。',
  '分布式锁':'多台机器抢一把"锁"，谁抢到谁干活，防止重复执行。',
  'IO多路复用':'一个线程盯着所有连接，谁有数据就处理谁，不用一个连接一个线程。',
  '热key':'访问量爆炸的单个 key，会把单台 Redis 打挂。',
  '大key':'value 特别大的 key，传输慢、拖累整条链路。',
  '三次握手':'建立连接前互相确认：你能听吗→能，你能吗→能。共发 3 个包。',
  '四次挥手':'断开连接时互道再见：我要关了→好→我也要关了→好。',
  'TCP':'可靠的传输协议：像寄挂号信，丢了会重寄，保证顺序。',
  'UDP':'不管到没到的传输：像广播，快但不保证送达。',
  'HTTPS':'HTTP 外面套了一层加密壳（TLS），防偷看防篡改。',
  'TLS':'给 HTTP 加密的协议：先握手换钥匙，之后内容加密传输。',
  '状态码':'服务器返回的结果代码：200 成功、404 找不到、500 服务器挂了。',
  'Cookie':'存在浏览器里的小纸条，每次请求自动带上，让服务器认人。',
  'Session':'存在服务器里的档案，靠 Cookie 里的编号找到对应档案。',
  'Token':'一张"通行证"：服务器验证签名就认账，不用存档案，跨域方便。',
  'JWT':'一种通行证格式：信息自带在通行证里，无需服务器查档案。',
  '粘包':'TCP 是数据流没有边界，多个包粘到一起了，要自己分界。',
  '拆包':'一个完整的数据包被拆成几段传输，要自己拼回来。',
  'DNS':'把网址翻译成 IP 的"电话簿"。',
  'RESTful':'一套接口设计规范：URL 用名词表示资源，动词用 HTTP 方法。',
  'SSE':'服务器单向推送：浏览器发一次请求，连接不断，服务器随时推消息。',
  'WebSocket':'双向实时通道，浏览器和服务器都能随时发，聊天用它。',
  '幂等':'同一个操作做几次结果都一样，不会重复扣钱、重复下单。',
  'RAG':'检索增强生成：先从资料库搜出相关内容，再让 AI 照着资料回答。',
  '向量检索':'按"意思"搜索：把文字变成一串数字，找数字最接近的。',
  'Embedding':'把文字变成一串数字（向量）：意思相近的文字，数字也相近。',
  'LangChain4j':'Java 版的大模型开发框架，封装了对话、检索、工具调用等。',
  'WebFlux':'Spring 的异步响应式框架，不阻塞线程，高并发下省资源。',
  '流式':'AI 边生成边把字推给前端，像打字机一样，不用等全部生成完。',
  'NL2SQL':'自然语言转 SQL：用户说人话，系统生成 SQL 去查数据库。',
  'JSqlParser':'解析和校验 SQL 的 Java 库：能看清一条 SQL 到底干了什么。',
  '纵深防御':'多层防护层层设卡：提示词约束 + SQL 校验 + 只读账号，一层被破还有下一层。',
  '只读账号':'只能查不能改的数据库账号，就算被注入也删不了数据。',
  '滑动窗口':'只保留最近 N 条对话，防止上下文越积越多爆掉。',
  'Session共享':'多台服务器之间让用户登录状态通用，不用每台各存各的。'
};
const TERM_KEYS = Object.keys(TERMS).sort((a,b)=>b.length-a.length);
function gloss(html){
  if(!html) return html;
  let out = html;
  for(const k of TERM_KEYS){
    const pat = k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re = new RegExp('([^A-Za-z0-9\\u4e00-\\u9fa5]|^)'+pat+'([^A-Za-z0-9\\u4e00-\\u9fa5]|$)', 'g');
    out = out.replace(re, '$1<span class="term" data-term="'+k+'">'+k+'</span>$2');
  }
  return out;
}
document.addEventListener('click', function(e){
  const t = e.target.closest && e.target.closest('.term');
  if(t){
    e.stopPropagation();
    const key = t.getAttribute('data-term');
    const desc = TERMS[key];
    if(!desc) return;
    let pop = document.getElementById('termPop');
    if(!pop){
      pop = document.createElement('div');
      pop.id = 'termPop';
      pop.className = 'term-pop';
      document.body.appendChild(pop);
    }
    pop.innerHTML = '<div class="tp-k">'+esc(key)+'</div><div class="tp-t">'+esc(desc)+'</div>';
    pop.style.display = 'block';
    const r = t.getBoundingClientRect();
    const pw = pop.offsetWidth, ph = pop.offsetHeight;
    let x = r.left + r.width/2 - pw/2;
    x = Math.max(8, Math.min(x, window.innerWidth - pw - 8));
    let y = r.top - ph - 12;
    if(y < 8) y = r.bottom + 12;
    pop.style.left = x + 'px';
    pop.style.top = y + 'px';
    return;
  }
  const pop = document.getElementById('termPop');
  if(pop && !e.target.closest('#termPop')) pop.style.display = 'none';
});

/* ================= 路由 ================= */
let currentRoute = '#/dashboard';
function parseRoute(){
  const h = location.hash || '#/dashboard';
  const [path, query] = h.split('?');
  return {path, query: new URLSearchParams(query||'')};
}
function go(route){ location.hash = route; }
window.addEventListener('hashchange', ()=>{ render(); });
function render(){
  const {path, query} = parseRoute();
  currentRoute = path;
  $$('#topNav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.route === path);
  });
  const app = $('#app');
  app.classList.remove('fade-in');
  void app.offsetWidth;
  app.classList.add('fade-in');
  if(path === '#/dashboard') renderDashboard(app);
  else if(path === '#/bank') renderBank(app, query);
  else if(path === '#/flash') renderFlash(app);
  else if(path === '#/mock') renderMock(app);
  else if(path === '#/review') renderReview(app);
  else if(path === '#/terms') renderTerms(app);
  else if(path === '#/mine') renderMine(app);
  else { location.hash = '#/dashboard'; return; }
  renderTree(path, query);
  refreshChrome();
  app.scrollTop = 0;
  window.scrollTo && window.scrollTo(0,0);
  closeSidebar();
}
function refreshChrome(){
  const o = overall();
  $('#stTotal').textContent = o.total;
  $('#stKnow').textContent = o.know;
  $('#stFuzzy').textContent = o.fuzzy;
  $('#stBad').textContent = o.bad;
  $('#stFav').textContent = Object.keys(store.fav).length;
  $('#stDate').textContent = new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'short'});
  $('#heatToday').textContent = todayCount();
  $('#heatRate').textContent = o.knowRate + '%';
  $('#stRoute').textContent = currentRoute.replace('#/','');
  $('#treeTotal').textContent = o.total + ' 题';
}

function renderTree(path, query){
  const tree = $('#tree');
  const curCat = query.get('cat') || '';
  const curQ = query.get('q') || '';
  let html = '';
  CAT_ORDER.forEach(cid=>{
    const c = CATS[cid];
    const s = catStats(cid);
    const open = (path === '#/bank' && (curCat === cid || (curCat==='' && !curQ))) || s.done===0 ? false : false;
    // 自动展开：题库页当前分类；闪卡/模拟等场景保持折叠
    const isOpen = (path === '#/bank' && curCat === cid) || (path === '#/bank' && !curCat && cid==='java');
    html += '<div class="tree-group'+(isOpen?' open':'')+'" data-cat="'+cid+'">';
    html += '<button class="tree-cat" data-action="toggle-cat" data-cat="'+cid+'">';
    html += '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>';
    html += '<span class="name">'+c.name+'</span>';
    if(s.rate>0 && s.rate<100) html += '<span class="badge" style="background:var(--warn-soft);color:var(--warn)">'+s.rate+'%</span>';
    else if(s.rate===100) html += '<span class="badge" style="background:var(--ok-soft);color:var(--ok)">100%</span>';
    html += '<span class="meta">'+s.done+'/'+s.total+'</span></button>';
    html += '<div class="tree-qlist">';
    QUESTIONS.filter(q=>q.cat===cid).forEach(q=>{
      html += '<button class="tree-q'+(curQ===q.id?' active':'')+'" data-action="open-q" data-cat="'+cid+'" data-q="'+q.id+'">';
      html += statusDot(q.id);
      html += '<span class="txt">'+esc(q.q)+'</span>';
      if(q.rel) html += '<span class="rel">简历</span>';
      html += '</button>';
    });
    html += '</div></div>';
  });
  tree.innerHTML = html;
  const foot = $('#treeFoot');
  foot.textContent = '// 总览 '+overall().total+' 题 · 分类刷题 · 模拟面试';
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action],[data-route]');
  if(!el) return;
  if(el.hasAttribute('data-route')){ go(el.dataset.route); return; }
  const action = el.dataset.action;
  if(action === 'toggle-cat'){
    const g = el.closest('.tree-group');
    g.classList.toggle('open');
  }
  else if(action === 'open-q'){
    go('#/bank?cat='+el.dataset.cat+'&q='+el.dataset.q);
  }
  else if(action === 'themes'){ go('#/bank?themes=1'); }
  else if(action === 'theme-start'){ go('#/bank?theme='+el.dataset.cat+'&step=0'); }
  else if(action === 'theme-next'){ go(el.dataset.hash); }
  else if(action === 'theme-back'){ go('#/bank?themes=1'); }
  else if(action === 'toggle-sidebar'){
    $('#sidebar').classList.toggle('open');
    $('#mask').classList.toggle('show');
  }
  else if(action === 'mark'){
    markQ(el.dataset.q, el.dataset.level === 'none' ? null : el.dataset.level);
    renderBankDetail();
    // 若在闪卡/模拟中，更新按钮态
    const flash = $('#flashArea'); if(flash) renderFlashArea();
  }
  else if(action === 'fav'){
    toggleFav(el.dataset.q);
    renderBankDetail();
    const fa = $('#flashArea'); if(fa) renderFlashArea();
  }
  else if(action === 'flash-next'){ flashNext(); }
  else if(action === 'flash-flip'){ flashFlip(); }
  else if(action === 'flash-mark'){ flashMark(el.dataset.level); }
  else if(action === 'flash-restart'){ flashStart(); }
  else if(action === 'flash-fav'){ toggleFav(el.dataset.q); const _fa = $('#flashArea'); if(_fa) renderFlashArea(); }
  else if(action === 'mock-start'){ mockStart(); }
  else if(action === 'mock-flip'){ mockFlip(); }
  else if(action === 'mock-mark'){ mockMark(el.dataset.level); }
  else if(action === 'mock-next'){ mockNext(); }
  else if(action === 'mock-finish'){ mockFinish(); }
  else if(action === 'mock-restart'){ location.hash = '#/mock'; }
  else if(action === 'mock-pause'){ mockPause(); }
  else if(action === 'nav-bank'){ go('#/bank?cat='+(el.dataset.cat||'')); }
  else if(action === 'route'){ go(el.dataset.to); }
  else if(action === 'mine-tab'){ renderMine($('#app'), el.dataset.tab); }
  else if(action === 'clear-mocks'){
    store.mocks = []; saveStore(); renderMine($('#app'));
  }
});

  return '<div class="ring"><svg width="128" height="128" viewBox="0 0 128 128">'
    +'<circle cx="64" cy="64" r="'+r+'" fill="none" stroke="var(--panel-2)" stroke-width="11"/>'
    +'<circle cx="64" cy="64" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'
    +'</svg><div class="ring-num"><b>'+rate+'%</b><span>进度</span></div></div>';
}

/* ================= 视图：题库 ================= */
let bankSearch = '';
function renderBank(app, query){
  if(query.get('themes')){ renderThemes(app); return; }
  const themeCat = query.get('theme') || '';
  if(themeCat){ renderThemePlay(app, query, themeCat); return; }
  const curCat = query.get('cat') || '';
  const curQ = query.get('q') || '';
  let list = QUESTIONS;
  if(curCat) list = list.filter(q=>q.cat===curCat);
  if(bankSearch) list = list.filter(q=>q.q.includes(bankSearch) || q.a.includes(bankSearch));
  const qsHtml = list.length ? list.map((q,i)=>(
    '<button class="qitem" data-action="open-q" data-cat="'+q.cat+'" data-q="'+q.id+'">'
    +statusDot(q.id)
    +'<span class="qidx">'+String(i+1).padStart(2,'0')+'</span>'
    +'<span class="qmain"><span class="qtitle">'+hl(esc(q.q), bankSearch)+'</span>'
    +'<span class="qsub">'+CATS[q.cat].name+(q.rel?' · 简历关联':'')+'</span></span>'
    +(store.fav[q.id]?'<svg style="width:15px;height:15px;color:var(--warn)" viewBox="0 0 24 24" fill="currentColor"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>':'')
    +'<svg class="chev" style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>'
    +'</button>'
  )).join('') : '<div class="empty"><b>没有匹配的题目</b>换个关键词试试</div>';

  app.innerHTML =
  '<div class="bank-layout">'
    +'<div class="bank-list">'
      +'<div class="bank-toolbar">'
        +'<div class="search-box">'+ic('bolt').replace('<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>','<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>')+'<input id="searchInput" placeholder="搜索题目或答案关键词，如：HashMap、事务、RAG…" value="'+esc(bankSearch)+'"></div>'
        +'<span class="bank-rc">'+(bankSearch?'搜索到 <b style="color:var(--accent)">'+list.length+'</b> 题':'共 '+list.length+' 题')+'</span>'
        +'<button class="btn sm" data-action="route" data-to="#/flash">闪卡模式</button>'
        +'<button class="btn sm" data-action="themes">📚 串讲模式</button>'
        +'<button class="btn sm" data-action="route" data-to="#/mock">模拟面试</button>'
      +'</div>'
      + (curQ ? '' : qsHtml)
    +'</div>'
  +'</div>';
  const si = $('#searchInput');
  if(si){
    si.addEventListener('input', function(){
      bankSearch = si.value.trim();
      render();
    });
  }
  if(curQ){
    const q = QUESTIONS.find(x=>x.id===curQ);
    if(q){
      const catQs = QUESTIONS.filter(x=>x.cat===q.cat);
      const idx = catQs.findIndex(x=>x.id===q.id);
      const prev = catQs[idx-1], next = catQs[idx+1];
      const rel = q.rel ? '<div class="detail-rel">'+ic('bolt')+'简历关联考点 —— 面试官可能围绕这个追问</div>' : '';
      const plain = PLAIN[q.id] ? '<div class="plain-box"><div class="plain-tag">💡 大白话 <span style="font-weight:400;color:var(--ink-3);margin-left:6px">带下划线的词都能点开看解释</span></div><div class="plain-text">'+gloss(esc(PLAIN[q.id]))+'</div></div>' : '';
      const diag = DIAG[q.id] ? '<div class="diag-box"><div class="diag-tag">📊 示意图</div>'+DIAG[q.id]+'</div>' : '';
      app.innerHTML =
      '<div class="detail">'
        +'<div class="detail-tab"><span class="file-dot"></span>'+CATS[q.cat].name+' / <span class="path">'+q.id+'.java</span></div>'
        +'<div class="detail-body">'
          +'<div class="detail-q">'+esc(q.q)+'</div>'
          +rel
          +plain
          +diag
          +'<div class="answer-label">参考答案</div>'
          +'<div class="answer">'+renderAnswer(q.a)+'</div>'
        +'</div>'
        +'<div class="detail-actions">'
          +'<button class="mark-btn'+(store.mastery[q.id]==='know'?' on-ok':'')+'" data-action="mark" data-q="'+q.id+'" data-level="know">✓ 已掌握</button>'
          +'<button class="mark-btn'+(store.mastery[q.id]==='fuzzy'?' on-warn':'')+'" data-action="mark" data-q="'+q.id+'" data-level="fuzzy">～ 模糊</button>'
          +'<button class="mark-btn'+(store.mastery[q.id]==='unknown'?' on-bad':'')+'" data-action="mark" data-q="'+q.id+'" data-level="unknown">✕ 不会</button>'
          +'<button class="mark-btn'+(store.mastery[q.id]?'':'')+'" data-action="mark" data-q="'+q.id+'" data-level="none">清除标记</button>'
          +'<button class="mark-btn'+(store.fav[q.id]?' on-fav':'')+'" data-action="fav" data-q="'+q.id+'">'+(store.fav[q.id]?'★ 已收藏':'☆ 收藏')+'</button>'
        +'</div>'
        +'<div class="detail-nav">'
          +'<button class="nav-btn" data-action="open-q" data-cat="'+q.cat+'" data-q="'+(prev?prev.id:'')+'" '+(prev?'':'disabled')+'>← 上一题</button>'
          +'<span>'+CATS[q.cat].name+' · '+(idx+1)+' / '+catQs.length+'</span>'
          +'<button class="nav-btn" data-action="open-q" data-cat="'+q.cat+'" data-q="'+(next?next.id:'')+'" '+(next?'':'disabled')+'>下一题 →</button>'
        +'</div>'
      +'</div>';
    } else {
      app.innerHTML = '<div class="empty"><b>题目不存在</b><a href="#/bank" style="color:var(--accent)">返回题库</a></div>';
    }
  }
}

  +'<div class="detail-tab"><span class="file-dot"></span>串讲 · '+CATS[themeCat].name+'<span class="theme-progress">第 '+(step+1)+' / '+all.length+' 讲</span></div>'
  +'<div class="detail-body">'

  +'</div>'

    +'<button class="mark-btn'+(store.mastery[q.id]==='fuzzy'?' on-warn':'')+'" data-action="mark" data-q="'+q.id+'" data-level="fuzzy">～ 模糊</button>'
    +'<button class="mark-btn'+(store.mastery[q.id]==='unknown'?' on-bad':'')+'" data-action="mark" data-q="'+q.id+'" data-level="unknown">✕ 不会</button>'
    +'<button class="mark-btn" data-action="theme-back">← 主题列表</button>'
  +'</div>'
  +'<div class="detail-nav">'
    +'<button class="nav-btn" data-action="theme-next" data-hash="'+(step>0?'#/bank?theme='+themeCat+'&step='+(step-1):'#/bank?themes=1')+'" '+(step>0?'':'disabled')+'>← 上一个知识点</button>'
    +'<span>'+(step+1)+' / '+all.length+'</span>'
    +'<button class="nav-btn" data-action="theme-next" data-hash="'+nextHash+'">'+(step+1<all.length?'下一个知识点 →':'完成串讲 ✓')+'</button>'
  +'</div>'
  +'</div>';

/* ================= 视图：闪卡 ================= */
let flashState = {cat:'', list:[], idx:0, flipped:false, done:false};
function renderFlash(app){
  app.innerHTML =
  '<div class="flash-wrap">'
    +'<div class="flash-config">'
      +'<span class="fc-label">分类</span>'
      +'<select class="select" id="flashCat">'
        +'<option value="">全部（'+overall().total+' 题）</option>'
        +CAT_ORDER.map(c=>'<option value="'+c+'"'+(flashState.cat===c?' selected':'')+'>'+CATS[c].name+'（'+catStats(c).total+' 题）</option>').join('')
      +'</select>'
      +'<button class="btn primary sm" data-action="flash-start" id="flashStart">开始闪卡</button>'
      +'<span style="font-size:11.5px;color:var(--ink-3)">空格翻面 · 1/2/3 快速标记</span>'
    +'</div>'
    +'<div id="flashArea"></div>'
  +'</div>';
  $('#flashCat').addEventListener('change', function(){
    flashState.cat = this.value;
    $('#flashStart').textContent = '开始闪卡';
    $('#flashArea').innerHTML = '';
  });
  $('#flashStart').addEventListener('click', flashStart);
}
function flashStart(){
  const cat = flashState.cat;
  let list = cat ? QUESTIONS.filter(q=>q.cat===cat) : QUESTIONS.slice();
  // 优先把 待巩固/模糊 的放前面
  list.sort((a,b)=>{
    const wa = store.mastery[a.id]==='unknown'?0:store.mastery[a.id]==='fuzzy'?1:2;
    const wb = store.mastery[b.id]==='unknown'?0:store.mastery[b.id]==='fuzzy'?1:2;
    return wa-wb;
  });
  if(!list.length) return;
  flashState = {cat, list, idx:0, flipped:false, done:false};
  renderFlashArea();
}
function renderFlashArea(){
  const area = $('#flashArea');
  if(!area) return;
  const s = flashState;
  if(s.done || s.idx >= s.list.length){
    const r = {know:0, fuzzy:0, bad:0};
    s.list.forEach(q=>{ const m=store.mastery[q.id]; if(m==='know')r.know++; else if(m==='fuzzy')r.fuzzy++; else if(m==='unknown')r.bad++; });
    area.innerHTML = '<div class="card flash-done">'
      +'<h3>本轮完成</h3><p>共刷 '+s.list.length+' 题</p>'
      +ringHTML(Math.round((r.know+r.fuzzy)/s.list.length*100),'var(--ok)')
      +'<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><span class="chip ok">掌握 '+r.know+'</span><span class="chip warn">模糊 '+r.fuzzy+'</span><span class="chip bad">待巩固 '+r.bad+'</span></div>'
      +'<p style="margin-top:16px"><button class="btn primary" data-action="flash-restart">再来一轮</button></p>'
    +'</div>';
    return;
  }
  const q = s.list[s.idx];
  area.innerHTML =
  '<div class="card flash-card fade-in" id="flashCard">'
    +'<div class="flash-head">'
      +'<span>'+CATS[q.cat].name+(q.rel?' · 简历关联':'')+'</span>'
      +'<span class="fbar"><span style="width:'+Math.round(s.idx/s.list.length*100)+'%"></span></span>'
      +'<span>'+(s.idx+1)+' / '+s.list.length+'</span>'
    +'</div>'
    +'<div class="flash-body">'
      +'<div class="flash-q">'+esc(q.q)+'</div>'
      +(s.flipped?'':'<div class="flash-hint">先在脑中组织答案，再点击下方「显示答案」对照</div>')
      +(s.flipped?'<div class="flash-ans"><div class="answer-label">参考答案</div><div class="answer">'+renderAnswer(q.a)+'</div></div>':'')
    +'</div>'
    +'<div class="flash-actions">'
      +(s.flipped
        ? '<button class="btn ok sm" data-action="flash-mark" data-level="know" style="background:var(--ok);border-color:var(--ok);color:#fff">✓ 会了</button>'
          +'<button class="btn warn sm" data-action="flash-mark" data-level="fuzzy" style="background:var(--warn);border-color:var(--warn);color:#fff">～ 模糊</button>'
          +'<button class="btn bad sm" data-action="flash-mark" data-level="unknown" style="background:var(--bad);border-color:var(--bad);color:#fff">✕ 不会</button>'
        : '<button class="btn primary" data-action="flash-flip">显示答案</button>')
      +'<button class="btn ghost sm" data-action="flash-fav" data-q="'+q.id+'">'+(store.fav[q.id]?'★ 已收藏':'☆ 收藏')+'</button>'
    +'</div>'
  +'</div>';
}
function flashFlip(){
  if(flashState.done) return;
  flashState.flipped = true;
  renderFlashArea();
}
function flashMark(level){
  const q = flashState.list[flashState.idx];
  markQ(q.id, level);
  addToday();
  flashState.idx++;
  flashState.flipped = false;
  renderFlashArea();
}

let mockState = {phase:'setup', count:10, cats:null, list:[], idx:0, flipped:false, timer:0, timerInt:null, paused:false};

          +'<p style="font-size:12.5px;color:var(--ink-2);margin-bottom:10px">按真实面试节奏随机抽题，先想再对答案，最后给出掌握度报告与复习建议。</p>'
        +'</div>'
        +'<div class="mock-row"><span class="ml">题目数量</span><div class="mc">'
          +[5,10,15].map(n=>'<button class="opt'+(mockState.count===n?' on':'')+'" data-action="mock-count" data-n="'+n+'">'+n+' 题</button>').join('')
        +'</div></div>'
        +'<div class="mock-row"><span class="ml">出题范围</span><div class="mc">'
          +'<button class="opt'+(mockState.cats===null?' on':'')+'" data-action="mock-cats" data-mode="all">全题库（'+overall().total+' 题）</button>'
          +'<button class="opt'+(mockState.cats==='resume'?' on':'')+'" data-action="mock-cats" data-mode="resume">仅简历关联题</button>'
          +'<button class="opt'+(mockState.cats==='pick'?' on':'')+'" data-action="mock-cats" data-mode="pick">自选分类</button>'
        +'</div></div>'
        +(mockState.cats==='pick'?'<div class="mock-row"><span class="ml">选择分类</span><div class="mc mock-cats">'
          +CAT_ORDER.map(c=>'<button class="cat-opt'+(mockState.pickCats&&mockState.pickCats[c]?' on':'')+'" data-action="mock-pick" data-c="'+c+'"><span class="cb"></span>'+CATS[c].name+'<span style="margin-left:auto;font-family:var(--mono);font-size:10px;opacity:.6">'+catStats(c).total+'</span></button>').join('')
        +'</div></div>':'')
        +'<div class="mock-row" style="border:none"><span class="ml">计时</span><div class="mc"><span style="font-size:12.5px;color:var(--ink-2)">每题建议 2-3 分钟内组织好回答，进入下一题前再对照答案</span></div></div>'
        +'<div style="padding:14px 0 6px;text-align:center"><button class="btn primary" data-action="mock-start" style="padding:11px 34px">开始面试</button></div>'
      +'</div>'
      : (mockState.phase==='running'
        ? '<div class="card" id="mockCard">'
            +'<div class="mock-timer"><span class="tt">TIMER</span><b id="mockTime">'+fmtTime(mockState.timer)+'</b><span class="tt" id="mockPauseLabel">'+(mockState.paused?'已暂停':'点击暂停')+'</span>'
            +'<span class="pause" data-action="mock-pause" id="mockPauseBtn" style="cursor:pointer">'+ (mockState.paused?'▶ 继续':'⏸ 暂停') +'</span></div>'
            +'<div class="mock-qbody" id="mockBody">'+mockQuestionHTML()+'</div>'
          +'</div>'
        : mockResultHTML()))
    +'</div>';
  // 事件：setup 阶段
  $$('#app [data-action="mock-count"]').forEach(b=>b.addEventListener('click', ()=>{
    mockState.count = +b.dataset.n; renderMock($('#app'));
  }));
  $$('#app [data-action="mock-cats"]').forEach(b=>b.addEventListener('click', ()=>{
    mockState.cats = b.dataset.mode==='all'?null : b.dataset.mode==='resume'?'resume':'pick';
    renderMock($('#app'));
  }));
  $$('#app [data-action="mock-pick"]').forEach(b=>b.addEventListener('click', ()=>{
    if(!mockState.pickCats) mockState.pickCats = {};
    mockState.pickCats[b.dataset.c] = !mockState.pickCats[b.dataset.c];
    renderMock($('#app'));
  }));
}
function fmtTime(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function mockStart(){
  let list;
  if(mockState.cats === 'resume') list = QUESTIONS.filter(q=>q.rel);
  else if(mockState.cats === 'pick'){
    const picked = Object.keys(mockState.pickCats||{}).filter(c=>mockState.pickCats[c]);
    list = QUESTIONS.filter(q=>picked.includes(q.cat));
  } else list = QUESTIONS.slice();
  if(!list.length){ alert('该范围暂无题目，请调整范围'); return; }
  list = list.slice().sort(()=>Math.random()-0.5).slice(0, Math.min(mockState.count, list.length));
  mockState.phase = 'running';
  mockState.list = list;
  mockState.idx = 0;
  mockState.flipped = false;
  mockState.timer = 0;
  mockState.paused = false;
  if(mockState.timerInt) clearInterval(mockState.timerInt);
  mockState.timerInt = setInterval(()=>{
    if(!mockState.paused && mockState.phase==='running'){
      mockState.timer++;
      const t = $('#mockTime'); if(t) t.textContent = fmtTime(mockState.timer);
    }
  },1000);
  renderMock($('#app'));
}
function mockPause(){
  mockState.paused = !mockState.paused;
  const l = $('#mockPauseLabel'); if(l) l.textContent = mockState.paused?'已暂停':'计时中';
  const b = $('#mockPauseBtn'); if(b) b.textContent = mockState.paused?'▶ 继续':'⏸ 暂停';
}
function mockQuestionHTML(){
  const s = mockState;
  if(s.idx >= s.list.length) return mockResultHTML();
  const q = s.list[s.idx];
  return '<div class="mock-qno">QUESTION '+(s.idx+1)+' / '+s.list.length+'</div>'
    +'<div class="mock-q">'+esc(q.q)+'</div>'
    +'<div class="mock-cats-tag">'+CATS[q.cat].name+(q.rel?' · 简历关联':'')+'</div>'
    +(s.flipped
      ? '<div class="flash-ans"><div class="answer-label">参考答案</div><div class="answer">'+renderAnswer(q.a)+'</div>'
        +'<div class="flash-actions" style="padding:14px 0 0">'
          +'<button class="btn sm" style="background:var(--ok);border-color:var(--ok);color:#fff" data-action="mock-mark" data-level="know">✓ 答得不错</button>'
          +'<button class="btn sm" style="background:var(--warn);border-color:var(--warn);color:#fff" data-action="mock-mark" data-level="fuzzy">～ 部分会</button>'
          +'<button class="btn sm" style="background:var(--bad);border-color:var(--bad);color:#fff" data-action="mock-mark" data-level="unknown">✕ 没答上来</button>'
        +'</div></div>'
      : '<div style="margin-top:26px"><button class="btn primary" data-action="mock-flip">我已作答，查看参考答案</button></div>');
}
function mockFlip(){ mockState.flipped = true; renderMock($('#app')); }
function mockMark(level){
  const q = mockState.list[mockState.idx];
  markQ(q.id, level);
  addToday();
  mockState.idx++;
  mockState.flipped = false;
  if(mockState.idx >= mockState.list.length) mockFinish();
  else renderMock($('#app'));
}
function mockFinish(){
  if(mockState.timerInt) clearInterval(mockState.timerInt);
  mockState.phase = 'done';
  const r = {know:0, fuzzy:0, bad:0, byCat:{}};
  mockState.list.forEach(q=>{
    const m = store.mastery[q.id];
    if(m==='know') r.know++; else if(m==='fuzzy') r.fuzzy++; else if(m==='unknown') r.bad++;
    if(!r.byCat[q.cat]) r.byCat[q.cat] = {know:0, fuzzy:0, bad:0, total:0};
    r.byCat[q.cat].total++;
    if(m==='know') r.byCat[q.cat].know++;
    else if(m==='fuzzy') r.byCat[q.cat].fuzzy++;
    else if(m==='unknown') r.byCat[q.cat].bad++;
  });
  const date = new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  store.mocks.push({date, total:mockState.list.length, know:r.know, fuzzy:r.fuzzy, bad:r.bad, timer:mockState.timer});
  saveStore();
  mockState.result = r;
  renderMock($('#app'));
}
function mockResultHTML(){
  const r = mockState.result;
  const total = mockState.list.length;
  const score = total? Math.round(r.know/total*100):0;
  let bars = '';
  Object.keys(r.byCat).forEach(cid=>{
    const b = r.byCat[cid];
    const rate = Math.round(b.know/b.total*100);
    bars += '<div class="result-bar"><span class="rb-name">'+CATS[cid].name+'</span><div class="progress"><span style="width:'+rate+'%;background:'+(rate>=70?'var(--ok)':rate>=40?'var(--warn)':'var(--bad)')+'"></span></div><span class="rb-num">'+rate+'%</span></div>';
  });
  const weak = Object.keys(r.byCat).filter(cid=> r.byCat[cid].bad > 0).map(cid=>CATS[cid].name);
  const advice = r.know/total>=0.7 ? '整体掌握不错，保持节奏，重点复习模糊项即可。'
    : r.know/total>=0.4 ? '基础过关但不够扎实，建议对「模糊」题目逐题回炉，先重看参考答案再合上默述。'
    : '当前掌握度偏低，不要焦虑——先按分类把题库过一遍，再从「我的 → 错题本」针对性复习。';
  return '<div class="card result-card">'
    +'<div class="result-score">'+score+'<span style="font-size:18px;color:var(--ink-3)"> / 100</span></div>'
    +'<div class="result-sub">'+total+' 题 · 掌握 '+r.know+' · 模糊 '+r.fuzzy+' · 待巩固 '+r.bad+' · 用时 '+fmtTime(mockState.timer)+'</div>'
    +'<div class="result-bars">'+bars+'</div>'
    +'<div class="suggest">'
      +(weak.length?'<div class="sg">'+ic('info')+'<span>建议优先复习：<b style="color:var(--ink)">'+weak.join('、')+'</b></span></div>':'')
      +'<div class="sg">'+ic('info')+'<span>'+advice+'</span></div>'
    +'</div>'
    +'<div style="display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap">'
      +'<button class="btn primary" data-action="mock-restart">再测一次</button>'
      +'<button class="btn" data-action="nav-bank" data-cat="">去题库复习</button>'
    +'</div>'
  +'</div>';
}

/* ================= 视图：我的 ================= */
function renderMine(app, tab){
  const curTab = tab || 'wrong';
  const wrong = QUESTIONS.filter(q=>store.mastery[q.id]==='unknown');
  const fuzzy = QUESTIONS.filter(q=>store.mastery[q.id]==='fuzzy');
  const favs = QUESTIONS.filter(q=>store.fav[q.id]);
  const tabs = [
    ['wrong','错题本（'+wrong.length+'）','var(--bad)'],
    ['fuzzy','模糊（'+fuzzy.length+'）','var(--warn)'],
    ['fav','收藏（'+favs.length+'）','var(--warn)'],
    ['hist','模拟记录（'+store.mocks.length+'）','var(--info)']
  ];
  const listFor = curTab==='wrong'?wrong : curTab==='fuzzy'?fuzzy : curTab==='fav'?favs : null;
  app.innerHTML =
  '<h2 style="font-size:17px;margin-bottom:4px">我的学习</h2>'
  +'<p style="font-size:12.5px;color:var(--ink-2);margin-bottom:14px">错题与收藏自动保存在本机浏览器，随时回来巩固。</p>'
  +'<div class="mine-tabs">'+tabs.map(t=>'<button class="mine-tab'+(curTab===t[0]?' on':'')+'" data-action="mine-tab" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
  if(curTab==='hist'){
    app.innerHTML += store.mocks.length
      ? '<div class="mock-hist">'+store.mocks.slice().reverse().map(m=>
          '<div class="mock-row-item"><span class="mdate">'+m.date+'</span>'
          +'<div class="mstat"><span class="chip ok">掌握 '+m.know+'</span><span class="chip warn">模糊 '+m.fuzzy+'</span><span class="chip bad">待巩固 '+m.bad+'</span><span class="chip ghost">'+m.total+' 题 · '+fmtTime(m.timer)+'</span></div>'
          +'<span class="mscore" style="color:'+(m.know/m.total>=0.7?'var(--ok)':m.know/m.total>=0.4?'var(--warn)':'var(--bad)')+'">'+Math.round(m.know/m.total*100)+'%</span></div>'
        ).join('')+'</div>'
        +'<div style="text-align:right;margin-top:10px"><button class="btn sm" data-action="clear-mocks">清空记录</button></div>'
      : '<div class="hist-empty"><b>还没有模拟记录</b>去「模拟面试」完成一次检验吧</div>';
  } else if(listFor && listFor.length){
    app.innerHTML += '<div style="display:flex;flex-direction:column;gap:9px">'+listFor.map(q=>
      '<button class="qitem" data-action="open-q" data-cat="'+q.cat+'" data-q="'+q.id+'">'
      +statusDot(q.id)+'<span class="qidx">'+q.cat.slice(0,2).toUpperCase()+'</span>'
      +'<span class="qmain"><span class="qtitle">'+esc(q.q)+'</span><span class="qsub">'+CATS[q.cat].name+(q.rel?' · 简历关联':'')+'</span></span>'
      +'<svg class="chev" style="width:15px;height:15px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>'
    ).join('')+'</div>';
  } else {
    app.innerHTML += '<div class="hist-empty"><b>'+(curTab==='wrong'?'没有待巩固的题目':'列表为空')+'</b>'+(curTab==='wrong'?'刷题时标记「不会」的题目会出现在这里':'去题库逛逛吧')+'</div>';
  }
}

/* ================= 启动 ================= */
render();
</script>
</body>
